name: Nightly build

on:
  schedule:
    # Every 4 hours on the hour (00:00, 04:00, 08:00 UTC, etc).
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

# Shared with social.yml: its hourly `0 * * * *` tick lands on this same
# minute six times a day now, and both workflows commit data/ and push.
# Without this they'd race on that push.
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run collect

      # The social ticker reads a third-party mirror, so a bad night there must
      # not fail the whole build — the site just renders without the ticker.
      - run: npm run social
        continue-on-error: true

      # Powers the player-name → commanders.com profile links in the digest
      # and river excerpts, plus the Roster page's photos. A bad night here
      # degrades to no links, same as a bad social night degrades to no
      # ticker — never worth failing the build. Season stats are refreshed
      # separately and weekly — see roster-stats.yml — not on this cadence.
      - run: npm run roster
        continue-on-error: true

      # Same cadence as roster — a single page fetch, cheap enough to run
      # every few hours, and depth chart moves change more often than the
      # roster itself does during camp/preseason.
      - run: npm run depth-chart
        continue-on-error: true

      - run: npm run schedule
        continue-on-error: true

      # ESPN's own scoreboard already tracks "the next game that hasn't been
      # played yet" (see betting.js), so this alone is what keeps the
      # matchup widget and the preview generator pointed at the right game
      # once one game ends and the next week's line opens — nothing had
      # been calling this on any schedule before, so the cache just sat on
      # whichever game was next the last time someone ran it by hand.
      - run: npm run betting
        continue-on-error: true

      # Third-party read on the same injury designations (see injuries.js
      # for why commanders.com's own page isn't scrapeable) — same
      # never-fail-the-build treatment as every other cache refresh here.
      - run: npm run injuries
        continue-on-error: true

      # Nothing called this on any schedule until now, so the NFC East widget
      # sat on whatever it was told the last time someone ran it by hand: it
      # was still showing all four teams at 0-0 the morning after Week 1,
      # from a snapshot taken 2026-08-26, before the season existed. Records
      # change every single week, so this belongs on the same cadence as the
      # rest of the caches above.
      - run: npm run standings
        continue-on-error: true

      # r/Commanders, for the Monday post's fan-reaction section only (see
      # src/lib/reddit.js). Nothing on the site renders this. It runs here
      # rather than in monday.yml because each feed only returns the newest
      # 25 entries, so a week of the sub has to be accumulated a few hours at
      # a time; by Monday morning there is nothing left to catch up on.
      - run: npm run reddit
        continue-on-error: true

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Commit the updated item state so tomorrow's run only adds genuinely
      # new items, the same idempotency `collect` already guarantees
      # locally. Nothing to commit on a quiet night is not an error.
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "nightly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # The reddit cache feeds the Monday post and nothing else, so it
            # changes almost every run without changing a single rendered
            # byte. Committing it is free; deploying for it is not.
            if git diff --cached --quiet -- ':(exclude)data/reddit.json'; then
              echo "only the reddit cache changed, which the site does not render"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            git commit -m "Nightly data update"
            git push
          fi

      # Nothing new collected means the build output is the same as the one
      # already live, so there's nothing to republish. The relative timestamps
      # that used to go stale between deploys are recomputed in the browser
      # now (see site.js), so a skipped deploy costs the reader nothing.
      - name: Deploy to Netlify
        if: steps.commit.outputs.changed == 'true'
        run: npx netlify deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}

