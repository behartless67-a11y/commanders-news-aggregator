name: Nightly build

on:
  schedule:
    # 08:00 UTC = 3 or 4 AM America/New_York depending on DST.
    - cron: '0 8 * * *'
  workflow_dispatch: {}

# Shared with social.yml: its hourly `0 * * * *` tick lands on this same
# minute once a day, and both workflows commit data/ and push. Without this
# they'd race on that push.
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run collect

      # The social ticker reads a third-party mirror, so a bad night there must
      # not fail the whole build — the site just renders without the ticker.
      - run: npm run social
        continue-on-error: true

      # Powers the player-name → commanders.com profile links in the digest
      # and river excerpts. A bad night here degrades to no links, same as a
      # bad social night degrades to no ticker — never worth failing the build.
      - run: npm run roster
        continue-on-error: true

      - run: npm run schedule
        continue-on-error: true

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Commit the updated item state so tomorrow's run only adds genuinely
      # new items, the same idempotency `collect` already guarantees
      # locally. Nothing to commit on a quiet night is not an error.
      - name: Commit updated data
        run: |
          git config user.name "nightly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no data changes" || git commit -m "Nightly data update"
          git push

      - name: Deploy to Netlify
        run: npx netlify deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}

