name: Publish on approve

on:
  push:
    branches: [master]
    paths:
      - 'data/digests/**'
      - 'data/previews/**'
  workflow_dispatch: {}

# Shared with nightly.yml/social.yml/roster-stats.yml — same push race, same fix.
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Deploy to Netlify
        run: npx netlify deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
