name: Publish on approve

on:
  push:
    branches: [master]
    paths:
      - 'data/digests/**'
      - 'data/previews/**'
      - 'data/mondays/**'
      # A hand-written original is published the moment it's committed — there
      # is no approval gate to fire this workflow later, so without this path
      # the post sat unbuilt until nightly.yml's next 4-hour tick.
      - 'data/originals/**'
      # Video breakdowns are hand-written too, usually in a commit of their own
      # on a Thursday or Friday of game week, and they're worth having up
      # before the weekend rather than at the next 4-hour nightly tick.
      - 'data/video-notes.json'
      # And a post is only as live as the templates that render it: shipping
      # markup or CSS for a new post shape in one push and the post itself in
      # another would deploy them hours apart.
      - 'src/**'
      # Netlify Functions ship in the same deploy as the site, so a change to
      # one is not live until something redeploys. These were missing, and it
      # only went unnoticed because every function change so far happened to
      # travel in a commit that also touched src/. A fix to the newsletter
      # template alone would have sat undeployed, and the next test send would
      # have looked exactly like the broken one it was meant to replace.
      - 'netlify/**'
      - 'netlify.toml'
  workflow_dispatch: {}

# Shared with nightly.yml/social.yml/roster-stats.yml — same push race, same fix.
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # To see whether a newer run of this workflow is already queued (below).
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # An editing session is often several pushes a few minutes apart, and
      # each one used to mean its own production deploy (Netlify credits).
      # So wait a moment, then step aside if a newer run of this workflow is
      # already queued: it checks out a later commit, so it deploys
      # everything this one would have. Oct 22.
      - name: Wait for follow-up pushes
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 90
          newer=$(gh run list --repo "${{ github.repository }}" --workflow publish-on-approve.yml --branch master --limit 10             --json databaseId,status --jq '[.[] | select(.databaseId > ${{ github.run_id }}) | select(.status != "completed")] | length' || echo 0)
          if [ "${newer:-0}" -gt 0 ]; then
            echo "a newer push is already queued, and its run will deploy"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.batch.outputs.superseded != 'true'

      - uses: actions/setup-node@v4
        if: steps.batch.outputs.superseded != 'true'
        with:
          node-version: 20

      - run: npm ci
        if: steps.batch.outputs.superseded != 'true'

      - run: npm run build
        if: steps.batch.outputs.superseded != 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Same check as nightly.yml: skip the deploy if the build matches what's
      # live (a push that only touched docs-adjacent code, say). See
      # src/site/build-hash.js.
      - name: Check whether the built site changed
        if: steps.batch.outputs.superseded != 'true'
        id: site
        run: node scripts/needs-deploy.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Deploy to Netlify
        if: steps.batch.outputs.superseded != 'true' && steps.site.outputs.changed == 'true'
        run: npx netlify deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
