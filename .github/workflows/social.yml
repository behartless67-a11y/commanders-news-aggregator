name: Social ticker refresh

# Separate from nightly.yml on purpose: articles are fine on a nightly
# cadence, but the ticker carries beat reporters' injury/practice updates that
# go stale within the hour, not overnight. This workflow only runs `social` +
# `build` — never `collect` — so it never re-fetches the news feeds.

on:
  schedule:
    # Every 4 hours, offset 2h from nightly's `0 */4` so the two never land on
    # the same minute and queue behind each other on the concurrency group
    # below. Was every 2 hours, which on a credits-priced Netlify account was
    # paying for 12 production deploys a day to refresh a ticker that only
    # actually changed about 5 times a day. The "X ago" labels that used to
    # need a fresh build now recompute in the browser (see site.js), so the
    # deploy cadence and how current the page looks are no longer the same
    # question.
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch: {}

# Shares a group with nightly.yml: both workflows commit data/ and push, so
# without this a tick that overlaps nightly's would race on that push.
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Third-party mirror — a bad hour must not fail the run, the ticker just
      # renders from whatever's already in data/social.json.
      - run: npm run social
        continue-on-error: true

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Social ticker update"
            # Another commit can land between this job's checkout and its push:
            # a parallel workflow, or a push from a laptop mid-run. Rebase onto
            # whatever arrived and try once more instead of failing the run.
            # -X theirs keeps this job's own freshly collected data when a cache
            # file conflicts, which is right: it just fetched the newer copy.
            git pull --rebase -X theirs -q origin master || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only when the ticker actually moved. This step used to run every tick
      # regardless, so more than half of this workflow's production deploys
      # republished byte-identical output.
      - name: Deploy to Netlify
        if: steps.commit.outputs.changed == 'true'
        run: npx netlify deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
