name: Weekly roster and team stats

on:
  schedule:
    # Tuesdays at 12:00 UTC (8am EDT / 7am EST) — after both Sunday's games
    # and Monday Night Football have gone final, so ESPN's per-player and
    # per-team season stats are fully settled before the Roster and Team
    # Stats widget read them. Any earlier in the week risks catching a
    # Monday-night player, or that game's box score, mid-game.
    - cron: '0 12 * * 2'
  workflow_dispatch: {}

# Shared with nightly.yml/social.yml — same push race, same fix.
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run roster-stats

      # Refreshes the current season's team offense/defense totals and ranks
      # for the sidebar's Team Stats widget (see src/lib/teamstats.js). Its
      # own defense derivation re-fetches every completed box score each run
      # rather than just the newest one, so this is the most expensive single
      # step here — still cheap enough weekly, but not something to move to a
      # more frequent cadence without also teaching it to fetch incrementally.
      # continue-on-error, same as every other cache refresh in this repo: a
      # bad week here should leave last week's cache in place, not fail the
      # build.
      - run: npm run team-stats
        continue-on-error: true

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Commit updated data
        run: |
          git config user.name "roster-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no data changes" || git commit -m "Weekly roster and team stats update"
          git push

      - name: Deploy to Netlify
        run: npx netlify deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
