[build]
  publish = "dist"
  functions = "netlify/functions"

[functions."admin-drafts"]
  included_files = ["data/digests/*.json", "data/previews/*.json", "data/mondays/*.json"]

[functions."admin-pipeline"]
  included_files = ["data/state.json"]

# The reader score poll only counts a pick for the game it's open for, which
# is worked out from the schedule (see capturePrediction()).
[functions."submission-created"]
  included_files = ["data/schedule.json"]

# "Just Quieter" went up on a Sunday night as a Monday post, then moved to
# an original once Ben pointed out it was still Sunday. Its first address
# was live for a few minutes, so it forwards rather than 404s.
[[redirects]]
  from = "/blog-monday-2026-10-05.html"
  to = "/blog-original-just-quieter.html"
  status = 301

[[redirects]]
  from = "/blog-monday-2026-10-05"
  to = "/blog-original-just-quieter"
  status = 301

# Security headers applied to every response from the CDN.
# None of these break the site — they only restrict what external parties
# can do with it (embed it in iframes, inject scripts, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent the site from being embedded in an iframe on another domain
    # (clickjacking protection).
    X-Frame-Options = "SAMEORIGIN"
    # Tell browsers not to sniff the content-type of responses.
    X-Content-Type-Options = "nosniff"
    # Don't send the full URL as a referrer when clicking outbound links —
    # just the origin (theburgundywire.com), not the specific path.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS for 1 year for any browser that has visited before.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Permissions policy: disable features we never use so a compromised
    # third-party script can't request them either.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
