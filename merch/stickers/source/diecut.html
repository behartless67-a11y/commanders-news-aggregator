<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Die-cut print file</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@600&display=block" rel="stylesheet">
<style>body{margin:0;background:#888;font-family:Teko;} canvas{display:block;max-width:100%;}</style>
</head>
<body>
<p id="status" style="font:14px sans-serif;color:#fff;margin:8px">working…</p>
<canvas id="out"></canvas>
<script>
/*
 * Builds the die-cut sticker artwork at print resolution:
 *   logo (Ideogram 2x upscale, background keyed out) + THEBURGUNDYWIRE.COM in
 *   Teko, surrounded by a smooth white border that follows the combined shape,
 *   with interior holes filled (a cutter can't cut them). Output: transparent
 *   PNG, saved through the local server's /save endpoint.
 */
const params = new URLSearchParams(location.search);
const BORDER = Number(params.get('border') || 52);   // px; ~0.17in at 300dpi, matching the mockup's chunky border
const CLOSE = Number(params.get('close') || 45);     // rounds off notches in the outline
const PAD = BORDER + CLOSE + 8;

function load(src) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }

/* Exact Euclidean distance transform (Felzenszwalb & Huttenlocher), so the border
   is a true round offset of the shape instead of an octagonal approximation.
   dist[i] = distance from pixel i to the nearest "inside" pixel. */
function edt1d(f, n, d, v, z) {
  let k = 0; v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
  }
  k = 0;
  for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
}
function distanceFrom(inside, w, h) {
  const INF = 1e20, g = new Float64Array(w * h);
  for (let i = 0; i < g.length; i++) g[i] = inside[i] ? 0 : INF;
  const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = g[y * w + x]; edt1d(f, h, d, v, z); for (let y = 0; y < h; y++) g[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = g[y * w + x]; edt1d(f, w, d, v, z); for (let x = 0; x < w; x++) g[y * w + x] = d[x]; }
  const out = new Float32Array(w * h); for (let i = 0; i < out.length; i++) out[i] = Math.sqrt(g[i]);
  return out;
}

/* Everything not reachable from the canvas edge through empty pixels is a hole: fill it. */
function fillHoles(mask, w, h) {
  const outside = new Uint8Array(w * h), stack = [];
  const push = (x, y) => { const i = y * w + x; if (!mask[i] && !outside[i]) { outside[i] = 1; stack.push(i); } };
  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
  for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
  while (stack.length) {
    const i = stack.pop(), x = i % w, y = (i - x) / w;
    if (x > 0) push(x - 1, y); if (x < w - 1) push(x + 1, y); if (y > 0) push(x, y - 1); if (y < h - 1) push(x, y + 1);
  }
  const filled = new Uint8Array(w * h);
  for (let i = 0; i < filled.length; i++) filled[i] = outside[i] ? 0 : 1;
  return filled;
}

(async () => {
  const status = document.getElementById('status');
  await document.fonts.load('600 100px Teko');
  const logo = await load('logo-hires.png');

  // Logo color for the URL: average of the solid burgundy pixels.
  const probe = document.createElement('canvas'); probe.width = logo.width; probe.height = logo.height;
  const pc = probe.getContext('2d'); pc.drawImage(logo, 0, 0);
  const pd = pc.getImageData(0, 0, probe.width, probe.height).data;
  let r = 0, g = 0, bl = 0, n = 0;
  for (let i = 0; i < pd.length; i += 4) if (pd[i + 3] === 255 && pd[i] > 80 && pd[i] > pd[i + 1] * 3) { r += pd[i]; g += pd[i + 1]; bl += pd[i + 2]; n++; }
  const burgundy = `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(bl / n)})`;

  // URL line sized to ~80% of the logo width.
  const text = 'THEBURGUNDYWIRE.COM';
  const m = document.createElement('canvas').getContext('2d');
  let size = 100; m.font = `600 ${size}px Teko`; m.letterSpacing = `${size * 0.12}px`;
  const targetW = logo.width * 0.80;
  size = size * targetW / m.measureText(text).width;
  m.font = `600 ${size}px Teko`; m.letterSpacing = `${size * 0.12}px`;
  const tw = m.measureText(text).width, ascent = size * 0.72;

  const gap = Math.round(size * 0.18);
  const W = Math.ceil(logo.width + PAD * 2), H = Math.ceil(logo.height + gap + ascent + PAD * 2);

  // Art layer: logo + URL.
  const art = document.createElement('canvas'); art.width = W; art.height = H;
  const ac = art.getContext('2d');
  ac.drawImage(logo, PAD, PAD);
  ac.font = `600 ${size}px Teko`; ac.letterSpacing = `${size * 0.12}px`; ac.fillStyle = burgundy; ac.textBaseline = 'alphabetic';
  ac.fillText(text, (W - tw) / 2 + size * 0.06, PAD + logo.height + gap + ascent);

  // Shape mask -> holes filled -> dilate by BORDER+CLOSE -> erode by CLOSE (a "closing", smooths notches).
  const ad = ac.getImageData(0, 0, W, H).data;
  let mask = new Uint8Array(W * H);
  for (let i = 0; i < mask.length; i++) mask[i] = ad[i * 4 + 3] > 40 ? 1 : 0;
  mask = fillHoles(mask, W, H);
  const dOut = distanceFrom(mask, W, H);
  const grown = new Uint8Array(W * H);
  for (let i = 0; i < grown.length; i++) grown[i] = dOut[i] <= BORDER + CLOSE ? 1 : 0;
  // Gaps that close up as the border grows (under WIRE, between the stars) become
  // holes in the grown shape; fill those too, or erosion would open them back up.
  const grownFilled = fillHoles(grown, W, H);
  const notGrown = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) notGrown[i] = grownFilled[i] ? 0 : 1;
  const dIn = distanceFrom(notGrown, W, H); // distance from the outside of the grown shape

  // Border layer: white, alpha anti-aliased on the outer edge.
  const out = document.getElementById('out'); out.width = W; out.height = H;
  const oc = out.getContext('2d');
  const border = oc.createImageData(W, H), bd = border.data;
  for (let i = 0; i < W * H; i++) {
    const a = Math.max(0, Math.min(1, dIn[i] - CLOSE + 0.5));
    bd[i * 4] = bd[i * 4 + 1] = bd[i * 4 + 2] = 255; bd[i * 4 + 3] = Math.round(a * 255);
  }
  oc.putImageData(border, 0, 0);
  oc.drawImage(art, 0, 0);

  // Trim to the border's bounding box plus a few px.
  const od = oc.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (od[(y * W + x) * 4 + 3] > 0) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const M = 4, tw2 = x1 - x0 + 1 + M * 2, th2 = y1 - y0 + 1 + M * 2;
  const trim = document.createElement('canvas'); trim.width = tw2; trim.height = th2;
  trim.getContext('2d').drawImage(out, x0 - M, y0 - M, tw2, th2, 0, 0, tw2, th2);

  const blob = await new Promise((ok) => trim.toBlob(ok, 'image/png'));
  const name = params.get('name') || 'burgundy-wire-diecut.png';
  const res = await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
  status.textContent = `${await res.text()} — ${tw2}x${th2}px, URL color ${burgundy}`;
  window.__done = { w: tw2, h: th2, burgundy };
})().catch((e) => { document.getElementById('status').textContent = 'error: ' + e; window.__done = { error: String(e) }; });
</script>
</body>
</html>
